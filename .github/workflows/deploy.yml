name: Deploy to GitHub & Cloudflare Pages

on:
  # 监听 master 分支的推送
  push:
    paths-ignore:
      - 'docs/**'
      - '**/*.md'
      - .dockerignore
      - .eslintrc.json
      - .gitignore
      - .mise.toml
      - .nomedia
      - .prettierrc
      - Dockerfile
      - deno.json
      - docker-compose.yml
      - eslint.config.js
      - eslint.config.mjs
      - prettier.config.js
      - prettier.config.mjs
    branches:
      - "master"

# 设置 GITHUB_TOKEN 权限，确保可以写入双平台的部署包
permissions:
  contents: read
  pages: write
  id-token: write
  deployments: write # 允许部署到 Cloudflare Pages

# 保证同一时间只有一个部署任务运行，避免互相冲突
concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  deploy-github:
    name: Deploy to GitHub Pages
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 0 # 💡 修复：拉取完整历史，防止新版 pnpm 过滤器失效

      - name: Install pnpm
        uses: pnpm/action-setup@v5
        with:
          version: 10
          run_install: false

      - name: Install Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 25
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --no-frozen-lockfile # 💡 修复：规避新版依赖冲突导致的锁文件报错

      - name: Setup Pages
        id: pages
        uses: actions/configure-pages@v6

      - name: Run Build
        run: pnpm build
        env:
          IS_GITHUB_PAGES: 'true'
          VITE_BASE_PATH: ${{ steps.pages.outputs.base_path }}

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: './dist'
          retention-days: 1
          include-hidden-files: true

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5

  deploy-cloudflare:
    name: Deploy to Cloudflare Pages
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 0 # 💡 修复：拉取完整历史，防止新版 pnpm 过滤器失效

      - name: Install pnpm
        uses: pnpm/action-setup@v5
        with:
          version: 10
          run_install: false

      # 💡 修复：删除了原先的 pnpm add wrangler 步骤，防止在 CI 环境中动态篡改 package.json 导致后续冲突

      - name: Install Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 25
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --no-frozen-lockfile # 💡 修复：规避新版依赖冲突导致的锁文件报错

      - name: Run Build
        run: pnpm build
        env:
          IS_CLOUDFLARE_PAGES: 'true'

      - name: Deploy to Cloudflare Pages
        uses: cloudflare/wrangler-action@v4
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          packageManager: pnpm
          wranglerVersion: 'latest' # 💡 修复：让 Action 自身去托管和调用最新版的 wrangler
          command: pages deploy ./dist --project-name=${{ vars.CLOUDFLARE_PAGES_PROJECT_NAME }}
          gitHubToken: ${{ secrets.GITHUB_TOKEN }}

      - name: Clean up old Cloudflare Pages Deployments
        uses: mfinelli/cloudflare-pages-cleanup@v1
        with:
          cloudflare_api_token: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          cloudflare_account_id: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          project: ${{ vars.CLOUDFLARE_PAGES_PROJECT_NAME }}
          min-to-keep: 1
          max-to-keep: 1
          emit_report_artifact: false
          emit_step_summary: false
